name: Build TikTok TV APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de APK a gerar"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Test Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "$ANDROID_SDK/licenses"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_SDK" || sudo chmod -R a+rwX "$ANDROID_SDK"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK/licenses/android-sdk-preview-license"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare optional .env configuration
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_AUTH_BACKEND_URL: ${{ secrets.TIKTOK_AUTH_BACKEND_URL }}
        run: |
          if [ -n "$TIKTOK_CLIENT_KEY" ] || [ -n "$TIKTOK_AUTH_BACKEND_URL" ]; then
            {
              echo "TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-YOUR_TIKTOK_CLIENT_KEY}"
              echo "TIKTOK_AUTH_BACKEND_URL=${TIKTOK_AUTH_BACKEND_URL:-https://your-tiktok-tv-auth-backend.example.com}"
            } > .env
            echo "Generated .env from GitHub Secrets."
          else
            echo "No TikTok GitHub Secrets set; Secrets Gradle Plugin will use .env.example defaults."
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Universal Debug APK (armeabi-v7a + arm64-v8a)
        if: ${{ inputs.build_type != 'release' }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-tv-universal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check release signing secrets availability
        id: release_secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK
        if: ${{ steps.release_secrets.outputs.available == 'true' && (inputs.build_type == 'release' || inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
          gradle :app:assembleRelease --no-daemon
          rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Fail if Release APK requested manually without signing secrets
        if: ${{ inputs.build_type == 'release' && steps.release_secrets.outputs.available != 'true' }}
        run: |
          echo "::error::Secrets ANDROID_KEYSTORE_BASE64, STORE_PASSWORD e KEY_PASSWORD são obrigatórias para gerar APK Release assinado."
          exit 1

      - name: Upload Release APK artifact
        if: ${{ steps.release_secrets.outputs.available == 'true' && (inputs.build_type == 'release' || inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-tv-universal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release on version tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
